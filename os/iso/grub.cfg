# MediaOS installer boot menu (replaces the Debian installer's own menu on the UEFI path).
set default=0
set timeout=10

if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi

menuentry "Install MediaOS (erases this computer's disk; you'll be asked first)" {
  set background_color=black
  linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg locale=en_GB.UTF-8 keymap=gb --- quiet
  initrd /install.amd/initrd.gz
}

menuentry "Boot from the first disk instead" {
  exit
}
