# MediaOS: keys while a video plays. mpv's own key bindings are switched off; each key below is passed to the
# MediaOS shell, which decides what it does. (Home never reaches mpv: sway catches it.)
ESC         script-message mediaos-key back
BS          script-message mediaos-key back
q           script-message mediaos-key stop
s           script-message mediaos-key stop
STOP        script-message mediaos-key stop
CLOSE_WIN   script-message mediaos-key stop
SPACE       script-message mediaos-key playPause
ENTER       script-message mediaos-key playPause
KP_ENTER    script-message mediaos-key playPause
PLAYPAUSE   script-message mediaos-key playPause
PLAY        script-message mediaos-key playPause
PAUSE       script-message mediaos-key playPause
LEFT        script-message mediaos-key rewind
REWIND      script-message mediaos-key rewind
PREV        script-message mediaos-key rewind
RIGHT       script-message mediaos-key fastForward
FORWARD     script-message mediaos-key fastForward
NEXT        script-message mediaos-key fastForward
