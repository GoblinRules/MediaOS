# MediaOS: sway runs one full-screen window at a time (the home screen, a streaming app or the video player).
# Everything is driven by the remote, so there is no bar, no borders and no mouse pointer.

output * bg #0b0d12 solid_color

default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse no
focus_on_window_activation focus
seat * hide_cursor 3000
# Apps (Chrome, mpv) must never be able to swallow the Home key.
seat * shortcuts_inhibitor disable

input type:keyboard xkb_layout gb

# Every window fills the screen. The newest one covers the home screen and gets the keyboard; when it closes the
# home screen is in front again.
for_window [all] fullscreen enable

# Home: sway catches it before any app does. A tap goes Home, holding it opens the Recovery menu.
bindsym --no-repeat F1 exec /usr/bin/mediaos-ctl home-down
bindsym --release F1 exec /usr/bin/mediaos-ctl home-up
bindsym --no-repeat XF86HomePage exec /usr/bin/mediaos-ctl home-down
bindsym --release XF86HomePage exec /usr/bin/mediaos-ctl home-up
# A keyboard way into Recovery, for when nothing else responds.
bindsym Ctrl+Mod1+BackSpace exec /usr/bin/mediaos-ctl recover

# Hand the Wayland details to systemd, then start the shell as a user service (restarted if it crashes).
exec sh -c 'systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE \
  WLR_RENDERER WLR_NO_HARDWARE_CURSORS MEDIAOS_SOFTWARE_VIDEO 2>/dev/null; systemctl --user start mediaos-shell.service'
